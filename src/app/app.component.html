<div class="app-container" [class.auth-layout]="!showSidebar">
  <div class="mobile-topbar" *ngIf="showSidebar">
    <button type="button" class="hamburger-btn" (click)="toggleMobileMenu()" aria-label="Open menu" [attr.aria-expanded]="mobileMenuOpen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18M3 12h18M3 18h18"/>
      </svg>
    </button>
    <a class="mobile-brand" routerLink="/dashboard">
      <span class="brand-mark">E</span>
      <span class="brand-text">Expense Tracker</span>
    </a>
  </div>

  <div class="mobile-backdrop" *ngIf="mobileMenuOpen" (click)="closeMobileMenu()"></div>

  <nav class="sidebar" [class.collapsed]="sidebarCollapsed" [class.mobile-open]="mobileMenuOpen" *ngIf="showSidebar">
    <div class="sidebar-top">
      <a class="brand" routerLink="/dashboard">
        <span class="brand-mark">E</span>
        <span class="brand-text">Expense Tracker</span>
      </a>
      <button type="button" class="collapse-btn" (click)="toggleSidebar()" [attr.aria-label]="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 5l-7 7 7 7"/>
        </svg>
      </button>
      <button type="button" class="mobile-close-btn" (click)="closeMobileMenu()" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>

    <div class="nav-scroll">
      <div class="nav-section">
        <span class="nav-section-label">Overview</span>
        <ul class="nav-menu" (click)="closeMobileMenu()">
          <li>
            <a routerLink="/dashboard" routerLinkActive="active" [title]="sidebarCollapsed ? 'Dashboard' : null">
              <span class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="7.5" height="9" rx="1.3"/>
                  <rect x="13.5" y="3" width="7.5" height="5.5" rx="1.3"/>
                  <rect x="13.5" y="12" width="7.5" height="9" rx="1.3"/>
                  <rect x="3" y="15.5" width="7.5" height="5.5" rx="1.3"/>
                </svg>
              </span>
              <span class="label">Dashboard</span>
            </a>
          </li>
        </ul>
      </div>

      <div class="nav-section">
        <span class="nav-section-label">Manage Money</span>
        <ul class="nav-menu" (click)="closeMobileMenu()">
          <li>
            <a routerLink="/accounts" routerLinkActive="active" [title]="sidebarCollapsed ? 'Accounts' : null">
              <span class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="6" width="18" height="13" rx="2.2"/>
                  <path d="M3 10.5h18"/>
                  <path d="M15.5 14.5h3"/>
                </svg>
              </span>
              <span class="label">Accounts</span>
            </a>
          </li>
          <li>
            <a routerLink="/categories" routerLinkActive="active" [title]="sidebarCollapsed ? 'Categories' : null">
              <span class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12.4 3.5h5.1A1.5 1.5 0 0 1 19 5v5.1a1.5 1.5 0 0 1-.44 1.06l-8 8a1.5 1.5 0 0 1-2.12 0l-4.5-4.5a1.5 1.5 0 0 1 0-2.12l8-8A1.5 1.5 0 0 1 12.4 3.5z"/>
                  <circle cx="15.5" cy="7.5" r="1" fill="currentColor" stroke="none"/>
                </svg>
              </span>
              <span class="label">Categories</span>
            </a>
          </li>
          <li>
            <a routerLink="/transactions" routerLinkActive="active" [title]="sidebarCollapsed ? 'Transactions' : null">
              <span class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 8h13"/>
                  <path d="M14 4.5 17.5 8 14 11.5"/>
                  <path d="M20 16H7"/>
                  <path d="M10 12.5 6.5 16 10 19.5"/>
                </svg>
              </span>
              <span class="label">Transactions</span>
            </a>
          </li>
          <li>
            <a routerLink="/budget" routerLinkActive="active" [title]="sidebarCollapsed ? 'Budgets' : null">
              <span class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="8.5"/>
                  <circle cx="12" cy="12" r="5"/>
                  <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
                </svg>
              </span>
              <span class="label">Budgets</span>
            </a>
          </li>
          <li>
            <a routerLink="/reminders" routerLinkActive="active" [title]="sidebarCollapsed ? 'Reminders' : null">
              <span class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 8.5a6 6 0 1 0-12 0c0 3.5-1 5-2 6.5h16c-1-1.5-2-3-2-6.5z"/>
                  <path d="M9.5 18a2.5 2.5 0 0 0 5 0"/>
                </svg>
              </span>
              <span class="label">Reminders</span>
            </a>
          </li>
        </ul>
      </div>

      <div class="nav-section" *ngIf="authService.isAdmin()">
        <span class="nav-section-label">Administration</span>
        <ul class="nav-menu" (click)="closeMobileMenu()">
          <li>
            <a routerLink="/admin/usermanagement" routerLinkActive="active" [title]="sidebarCollapsed ? 'User Management' : null">
              <span class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="9" cy="8" r="3"/>
                  <path d="M2.5 19c0-3.3 2.9-5.5 6.5-5.5s6.5 2.2 6.5 5.5"/>
                  <circle cx="17.3" cy="8.5" r="2.3"/>
                  <path d="M15.6 13.6c2.5.5 4.4 2.3 4.4 5.2"/>
                </svg>
              </span>
              <span class="label">User Management</span>
            </a>
          </li>
        </ul>
      </div>

      <div class="nav-section">
        <span class="nav-section-label">Account</span>
        <ul class="nav-menu" (click)="closeMobileMenu()">
          <li>
            <a routerLink="/profile" routerLinkActive="active" [title]="sidebarCollapsed ? 'Profile' : null">
              <span class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="3.3"/>
                  <path d="M4.7 20c0-3.8 3.2-6.2 7.3-6.2s7.3 2.4 7.3 6.2"/>
                </svg>
              </span>
              <span class="label">Profile</span>
            </a>
          </li>
        </ul>
      </div>
    </div>

    <div class="sidebar-footer">
      <button
        type="button"
        class="theme-toggle-btn"
        (click)="cycleTheme()"
        [title]="sidebarCollapsed ? ('Theme: ' + (themeService.preference$ | async)) : null"
        [attr.aria-label]="'Change theme, currently ' + (themeService.preference$ | async)"
      >
        <span class="icon" [ngSwitch]="themeService.preference$ | async">
          <svg *ngSwitchCase="'light'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.5"/>
            <path d="M12 2.5v2.4M12 19.1v2.4M4.4 4.4l1.7 1.7M17.9 17.9l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.4 19.6l1.7-1.7M17.9 6.1l1.7-1.7"/>
          </svg>
          <svg *ngSwitchCase="'dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.5 14.7A8.5 8.5 0 1 1 9.3 3.5a7 7 0 0 0 11.2 11.2z"/>
          </svg>
          <svg *ngSwitchDefault viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4.5" width="18" height="12" rx="1.6"/>
            <path d="M8 20h8M12 16.5V20"/>
          </svg>
        </span>
        <span class="label">Theme: {{ (themeService.preference$ | async) }}</span>
      </button>
      <div class="identity">
        <span class="identity-name">{{ currentUser?.username || 'Guest' }}</span>
        <span class="identity-email">{{ currentUser?.email }}</span>
      </div>
      <div class="footer-divider"></div>
      <button type="button" class="logout-btn" (click)="onLogout()" [title]="sidebarCollapsed ? 'Log out' : null">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5.5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2H9"/>
          <path d="M16 17l5-5-5-5"/>
          <path d="M21 12H9"/>
        </svg>
        <span class="label">Log out</span>
      </button>
    </div>
  </nav>

  <div class="app-shell" [class.full-width]="!showSidebar">
    <main class="main-content">
      <router-outlet />
    </main>
  </div>
</div>
