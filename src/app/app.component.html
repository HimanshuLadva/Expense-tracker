<div class="app-container" [class.auth-layout]="!showSidebar">
  <nav class="sidebar" *ngIf="showSidebar">
    <div class="sidebar-header">
      <a routerLink="/dashboard"><h2>Expense Tracker</h2></a>
    </div>
    <ul class="nav-menu">
      <li>
        <a routerLink="/dashboard" routerLinkActive="active">
          <span class="icon">📊</span>
          Dashboard
        </a>
      </li>
      <li>
        <a routerLink="/accounts" routerLinkActive="active">
          <span class="icon">🏦</span>
          Accounts
        </a>
      </li>
      <li>
        <a routerLink="/categories" routerLinkActive="active">
          <span class="icon">📁</span>
          Categories
        </a>
      </li>
      <li>
        <a routerLink="/transactions" routerLinkActive="active">
          <span class="icon">💳</span>
          Transactions
        </a>
      </li>
      <li>
        <a routerLink="/budget" routerLinkActive="active">
          <span class="icon">💰</span>
          Budget
        </a>
      </li>
      <li>
        <a routerLink="/reminders" routerLinkActive="active">
          <span class="icon">🔔</span>
          Reminders
        </a>
      </li>
      <li *ngIf="authService.isAdmin()">
        <a routerLink="/admin/usermanagement" routerLinkActive="active">
          <span class="icon">👥</span>
          User Management
        </a>
      </li>
      <li>
        <a routerLink="/profile" routerLinkActive="active">
          <span class="icon">👤</span>
          My Profile
        </a>
      </li>
      <li class="logout-item">
        <a (click)="onLogout()" class="logout-btn">
          <span class="icon">🚪</span>
          Logout
        </a>
      </li>
    </ul>
  </nav>

  <main class="main-content" [class.full-width]="!showSidebar">
    <router-outlet />
  </main>
</div>
